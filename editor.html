<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit portfolio</title><style>*{box-sizing:border-box}body{margin:0;font:14px/1.5 Arial,sans-serif;color:#252925;background:#f5f6f3}header{padding:16px 22px;background:white;border-bottom:1px solid #dde1da;display:flex;gap:18px;align-items:center;position:sticky;top:0;z-index:2}h1{font-size:17px;margin:0}button,select,input,textarea{font:inherit}button{cursor:pointer;background:#fff;border:1px solid #ccd1c8;border-radius:5px;padding:8px 12px}button.primary{background:#283a2c;color:white;border-color:#283a2c}header .actions{margin-left:auto;display:flex;gap:10px}.layout{display:grid;grid-template-columns:420px 1fr;height:calc(100vh - 73px)}aside{padding:22px;overflow:auto}iframe{width:100%;height:100%;border:0;background:white}label{display:block;font-size:12px;margin-bottom:16px}input,textarea,select{display:block;width:100%;padding:9px;margin-top:6px;border:1px solid #ccd1c8;border-radius:4px;background:white;color:#222}textarea{min-height:95px;resize:vertical}h2{font-size:17px;margin:25px 0 15px}h3{font-size:14px}p.note{font-size:12px;color:#666}fieldset{border:1px solid #d7dcd2;margin:15px 0;padding:12px;border-radius:5px}fieldset img{max-width:100%;max-height:130px;object-fit:contain}.row{display:flex;gap:8px;align-items:center}.row button{font-size:12px}.row>*{flex:1}#status{font-size:12px;color:#50614c}#status.error{color:#a12a20}a{color:#354d3a}.preview-toolbar{background:#fff;padding:9px;text-align:center;border-bottom:1px solid #ddd}.preview{height:100%;display:flex;flex-direction:column;align-items:center;overflow:auto;background:#e8eae5}.preview iframe{flex:1;min-height:0}header a{font-size:12px}@media(max-width:850px){.layout{grid-template-columns:1fr;height:auto}aside{overflow:visible}header{flex-wrap:wrap}.preview{height:650px}header .actions{margin-left:0}#status{width:100%}}#design-panel{padding:14px;margin:18px 0;border:1px solid #ccd1c8;border-radius:6px;background:#fff}#design-panel summary{font-weight:700;cursor:pointer}#design-panel label{margin:12px 0}#design-panel .row{align-items:start}#pick-component[aria-pressed="true"]{background:#dbe9f5;border-color:#287bb5}#design-hint{margin-bottom:0}.colour-row{display:flex;align-items:center;gap:6px;margin-bottom:12px}.colour-row input{margin:0;min-width:0}.colour-row input[type="color"]{width:45px;height:38px;padding:3px;flex:none}.colour-row input[type="text"]{flex:1}.colour-row button{font-size:12px;padding:8px}#design-colours label{margin:8px 0}#design-colours{margin-top:10px}</style></head><body><header><h1>Edit portfolio</h1><span id="status" role="status">Loading…</span><div class="actions"><button id="preview-save">Save & preview</button><button id="save">Save draft</button><button id="publish" class="primary">Publish all 3</button></div></header><div class="layout"><aside><label>Page<select id="page"><option value="home">Homepage</option></select></label><button id="add-project" type="button">Add project</button><details id="design-panel" open><summary>Font & spacing</summary><p class="note">Choose a component here, or select it in the preview. Blank values keep the original design.</p><button type="button" id="pick-component">Select in preview</button><label>Component<select id="design-component"><option value="">Loading preview…</option></select></label><div id="design-controls"><label>Font family<select id="design-font"><option value="">Original</option></select></label><div class="row"><label>Font size (px)<input id="design-size" type="number" min="8" max="160" step="1" placeholder="Original"></label><label>Weight<select id="design-bold"><option value="">Original</option><option value="false">Regular</option><option value="true">Bold</option></select></label></div><div class="row"><label>Space above (px)<input id="design-before" type="number" min="0" max="600" step="1" placeholder="Original"></label><label>Space below (px)<input id="design-after" type="number" min="0" max="600" step="1" placeholder="Original"></label></div><fieldset id="design-colours"><legend>Colours</legend><label>Text colour</label><div class="colour-row"><input type="color" id="design-color-picker" aria-label="Pick text colour"><input type="text" id="design-color" aria-label="Text colour hex" placeholder="Original" maxlength="7"><button type="button" data-clear-colour="color">Original</button></div><label>Background colour</label><div class="colour-row"><input type="color" id="design-background-picker" aria-label="Pick background colour"><input type="text" id="design-background" aria-label="Background colour hex" placeholder="Original / transparent" maxlength="11"><button type="button" data-clear-colour="background">Original</button></div><button type="button" id="design-transparent">Transparent background</button></fieldset><button type="button" id="design-reset">Reset this component</button></div><p id="design-hint" class="note" aria-live="polite"></p></details><div id="fields"></div><p class="note">Save draft to preview your changes. Publish updates Portfolio, Games and UI together. This editor runs only on your computer.</p></aside><section class="preview" aria-label="Website preview"><div class="preview-toolbar"><select id="view" aria-label="Preview type" style="display:inline-block;width:auto"><option value="portfolio">Portfolio</option><option value="games">Games</option><option value="ui">UI</option></select><button id="desktop">Desktop</button> <button id="mobile">Mobile</button> <a id="open-preview" href="#" target="_blank" rel="noopener">Open preview</a></div><iframe id="preview" title="Portfolio preview" src="about:blank"></iframe></section></div><script src="/__editor/design.js"></script><script>
(()=>{
if(location.protocol==='file:'){document.querySelector('.layout').innerHTML='<section style="padding:35px"><h2>Open your editor</h2><p>The hosted editor saves and publishes all three views.</p><a href="http://127.0.0.1:4195/editor">Open Editor</a></section>';document.querySelector('#status').textContent='Open the hosted editor';document.querySelectorAll('header button').forEach(b=>b.disabled=true);return;}
let data,token,current='home',dirty=false;const fields=document.querySelector('#fields'),status=document.querySelector('#status'),page=document.querySelector('#page'),frame=document.querySelector('#preview');const el=(tag,text)=>{const n=document.createElement(tag);if(text)n.textContent=text;return n};const message=(text,error=false)=>{status.textContent=text;status.className=error?'error':''};function changed(){dirty=true;message('Unsaved changes')}function field(parent,label,value,update,multi=false){const l=el('label',label),input=el(multi?'textarea':'input');input.value=value||'';input.addEventListener('input',()=>{update(input.value);changed()});l.append(input);parent.append(l);return input}function button(parent,label,action){const b=el('button',label);b.type='button';b.onclick=action;parent.append(b);return b}async function upload(file){if(file.size>24*1024*1024)throw Error('Use files under 24 MB.');const r=await fetch('/__editor/upload',{method:'POST',headers:{'X-File-Name':file.name,'X-Editor-Token':token},body:file});const j=await r.json();if(!r.ok)throw Error(j.error);return j.name}function uploader(parent,label,onFile,accept='image/png,image/jpeg,image/webp'){const l=el('label',label),input=el('input');input.type='file';input.accept=accept;input.onchange=async()=>{if(!input.files[0])return;message('Uploading…');try{const name=await upload(input.files[0]);onFile(name);changed();render()}catch(e){message(e.message,true)}};l.append(input);parent.append(l)}function assetField(parent,label,obj,key){field(parent,label,obj[key],v=>obj[key]=v);const im=el('img');im.src='/assets/'+encodeURIComponent(obj[key]);im.alt='Current image';im.style.maxWidth='100%';im.style.maxHeight='160px';parent.append(im);uploader(parent,'Replace image',v=>obj[key]=v)}function mediaFields(parent,p,section){p.layout||={sourcePage:'',ids:{},overviewMedia:[],rows:p.sections.map(()=>({headingId:'',textId:'',media:[]}))};const items=section===-1?p.layout.overviewMedia:p.layout.rows[section].media;const move=(i,d)=>{const j=i+d;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];changed();render()};items.forEach((m,i)=>{const details=el('details'),summary=el('summary',m.type==='gallery'?'Image gallery ('+m.images.length+')':m.type==='video'?'Video':'Image');details.append(summary);const row=el('div');row.className='row';button(row,'Move up',()=>move(i,-1)).disabled=i===0;button(row,'Move down',()=>move(i,1)).disabled=i===items.length-1;button(row,'Remove',()=>{items.splice(i,1);changed();render()});details.append(row);if(m.type==='gallery'){m.images.forEach((x,j)=>{const box=el('fieldset'),thumb=el('img');thumb.src='/assets/'+encodeURIComponent(x.name);thumb.alt=x.alt;box.append(thumb);field(box,'Caption',x.alt,v=>x.alt=v);const controls=el('div');controls.className='row';const swap=d=>{const k=j+d;if(k<0||k>=m.images.length)return;[m.images[j],m.images[k]]=[m.images[k],m.images[j]];changed();render()};button(controls,'Earlier',()=>swap(-1)).disabled=j===0;button(controls,'Later',()=>swap(1)).disabled=j===m.images.length-1;button(controls,'Remove image',()=>{m.images.splice(j,1);changed();render()});box.append(controls);details.append(box)});uploader(details,'Add gallery image',name=>m.images.push({name,alt:''}));}else if(m.type==='video'){field(details,'Video accessibility label',m.title||'',v=>m.title=v);const link=el('a','Preview video');link.href='/assets/'+encodeURIComponent(m.name);link.target='_blank';details.append(link);uploader(details,'Replace video (MP4, under 24 MB)',name=>m.name=name,'video/mp4');}else{assetField(details,'Image filename',m,'name');field(details,'Image description',m.alt||'',v=>m.alt=v);}parent.append(details)});uploader(parent,'Add image here',name=>items.push({type:'image',name,alt:''}));button(parent,'Add image gallery here',()=>{items.push({type:'gallery',images:[]});changed();render()});uploader(parent,'Add click-to-play video here (MP4, under 24 MB)',name=>items.push({type:'video',name,poster:p.cover,title:''}),'video/mp4');}

function render(){fields.replaceChildren();if(current==='home'){const h=data.home;fields.append(el('h2','Homepage'));field(fields,'Name',h.name,v=>h.name=v);field(fields,'Page description',h.title,v=>h.title=v);field(fields,'Introduction',h.intro,v=>h.intro=v,true);assetField(fields,'Homepage video poster filename',h,'heroImage');field(fields,'Homepage looping video filename',h.heroVideo||'',v=>h.heroVideo=v);uploader(fields,'Replace homepage looping video (MP4, under 24 MB)',name=>h.heroVideo=name,'video/mp4');assetField(fields,'Landscape banner filename',h,'bannerImage');fields.append(el('h2','Homepage About section'));field(fields,'Heading',h.aboutTitle,v=>h.aboutTitle=v);field(fields,'Subheading',h.behindTitle,v=>h.behindTitle=v);h.homeAbout.forEach((p,i)=>field(fields,'Paragraph '+(i+1),p,v=>h.homeAbout[i]=v,true));fields.append(el('h2','About'));assetField(fields,'Portrait filename',h,'portrait');h.about.forEach((p,i)=>field(fields,'Paragraph '+(i+1),p,v=>h.about[i]=v,true));fields.append(el('h2','Technical Toolkit'));(h.exactToolkit||[]).forEach(g=>{const d=el('details');d.append(el('summary',g.heading));field(d,'Section title',g.heading,v=>g.heading=v);field(d,'Description',g.text,v=>g.text=v,true);g.items.forEach(item=>{const box=el('fieldset');field(box,'Item title',item.heading,v=>item.heading=v);field(box,'Item description',item.text,v=>item.text=v,true);d.append(box)});fields.append(d)});fields.append(el('h2','Beyond the Screen'));(h.exactInterests||[]).forEach(item=>{const d=el('details');d.append(el('summary',item.heading));field(d,'Title',item.heading,v=>item.heading=v);field(d,'Text',item.text,v=>item.text=v,true);fields.append(d)});fields.append(el('h2','Contact'));for(const [k,label] of [['email','Email'],['linkedin','LinkedIn URL'],['instagram','Instagram URL']])field(fields,label,h[k],v=>h[k]=v,k==='contact');uploader(fields,'Replace résumé PDF',name=>h.resume=name,'application/pdf');fields.append(el('h2','Project order'));const orderNote=el('p','Newest years display first. This order controls projects within the same year.');orderNote.className='note';fields.append(orderNote);data.projects.forEach((p,i)=>{const row=el('div');row.className='row';row.append(el('span',p.title));const swap=j=>{[data.projects[i],data.projects[j]]=[data.projects[j],data.projects[i]];changed();render();options()};const up=button(row,'Move up',()=>swap(i-1));up.disabled=i===0;const down=button(row,'Move down',()=>swap(i+1));down.disabled=i===data.projects.length-1;fields.append(row)});}else{const p=data.projects.find(p=>p.slug===current);fields.append(el('h2','Project details'));const label=el('label','Project type'),select=el('select');for(const [value,text] of [['Game Design','Game'],['UI/UX Design','UI']]){const option=el('option',text);option.value=value;select.append(option)}select.value=p.category;select.onchange=()=>{const old=p.category;p.category=select.value;if(p.listLabel?.includes(old))p.listLabel=p.listLabel.replace(old,p.category);changed()};label.append(select);fields.append(label);for(const [k,label] of [['title','Title'],['year','Year'],['summary','Short description'],['role','Your role'],['tools','Tools'],['theme','Theme'],['overviewHeading','Overview heading'],['contributionsHeading','Contributions heading'],['homeTitle','Homepage title (optional)'],['listTitle','Project-list title (optional)'],['listLabel','Project-list label (optional)'],['status','Status (leave empty if complete)'],['intro','Overview']])field(fields,label,p[k],v=>p[k]=v,['summary','intro'].includes(k));field(fields,'Page address (lowercase words separated by hyphens)',p.slug,v=>{const old=p.slug;p.slug=v;if(current===old)current=v;options();page.value=current});assetField(fields,'Cover filename',p,'cover');fields.append(el('h2','Overview media'));mediaFields(fields,p,-1);fields.append(el('h2','Case study sections'));p.sections.forEach((s,i)=>{const box=el('fieldset');field(box,'Heading',s[0],v=>s[0]=v);field(box,'Text',s[1],v=>s[1]=v,true);mediaFields(box,p,i);button(box,'Remove section',()=>{p.sections.splice(i,1);if(p.layout)p.layout.rows.splice(i,1);p.videos=(p.videos||[]).filter(v=>v.section!==i).map(v=>({...v,section:v.section>i?v.section-1:v.section}));p.mediaGroups=(p.mediaGroups||[]).filter(g=>g.section!==i).map(g=>({...g,section:g.section>i?g.section-1:g.section}));changed();render()});fields.append(box)});button(fields,'Add section',()=>{p.sections.push(['New section','']);p.layout||={sourcePage:'',ids:{},overviewMedia:[],rows:[]};p.layout.rows.push({headingId:'',textId:'',media:[]});changed();render()});} }
let designFile='',designComponents=[],designSelected='',designPicking=false;const dc=document.querySelector('#design-component');for(const name of Object.keys(DESIGN_FONTS)){const o=el('option',name);o.value=name;document.querySelector('#design-font').append(o)}
function designSettings(){return data?.design?.[designFile]||{}}
function designSend(scroll=false){if(!data||!designFile)return;frame.contentWindow?.postMessage({channel:'portfolio-design',type:'settings',settings:designSettings(),selected:designSelected,picking:designPicking,scroll},location.origin)}
function designShow(){const selected=designComponents.find(c=>c.key===designSelected),s=designSettings()[designSelected]||{};for(const [id,k] of [['design-font','font'],['design-size','size'],['design-bold','bold'],['design-before','before'],['design-after','after']]){const input=document.querySelector('#'+id);input.value=s[k]===undefined?'':String(s[k]);input.disabled=!selected||(!selected.text&&['font','size','bold'].includes(k));if(input.tagName==='INPUT')input.placeholder=selected?String(Math.round(selected.defaults[k]||0)):'Original'}document.querySelector('#design-reset').disabled=!selected;document.querySelector('#design-hint').textContent=selected?(selected.text?'Font changes apply to this complete text block.':'This component supports spacing. Select a text block to change its font.'):'Choose a component from the preview.';dc.value=designSelected;showColours(selected,s)}
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==frame.contentWindow||event.data?.channel!=='portfolio-design')return;const m=event.data;if(!/^(index|about|all-projects|404)\.html$/.test(m.file)&&!/^projects\/[a-z0-9-]+\.html$/.test(m.file))return;if(m.type==='components'){if(designFile!==m.file)designSelected='';designFile=m.file;designComponents=m.components;dc.replaceChildren();for(const c of designComponents){const o=el('option',(c.text?'Text: ':'')+c.label);o.value=c.key;dc.append(o)}if(!designComponents.some(c=>c.key===designSelected))designSelected=designComponents[0]?.key||'';designShow();designSend()}if(m.type==='select'){designSelected=m.key;document.querySelector('#design-panel').open=true;designShow();designSend()}});
frame.addEventListener('load',()=>{frame.contentWindow?.postMessage({channel:'portfolio-design',type:'request'},location.origin)});dc.onchange=()=>{designSelected=dc.value;designShow();designSend(true)};document.querySelector('#pick-component').onclick=()=>{designPicking=!designPicking;const b=document.querySelector('#pick-component');b.setAttribute('aria-pressed',String(designPicking));b.textContent=designPicking?'Stop selecting':'Select in preview';designSend()};
for(const [id,key] of [['design-font','font'],['design-size','size'],['design-bold','bold'],['design-before','before'],['design-after','after']]){const input=document.querySelector('#'+id);input.addEventListener('input',()=>{if(!designSelected||!data)return;if(input.value!==''&&!input.checkValidity())return;data.design||={};data.design[designFile]||={};const settings=data.design[designFile][designSelected]||={};if(input.value==='')delete settings[key];else settings[key]=key==='font'?input.value:key==='bold'?input.value==='true':Number(input.value);changed();designSend()})}
function showColours(selected,settings){for(const k of ['color','background']){const input=document.querySelector('#design-'+k),picker=document.querySelector('#design-'+k+'-picker'),disabled=!selected||(k==='color'&&!selected.text);input.value=settings[k]||'';input.setCustomValidity('');picker.value=/^#[0-9a-f]{6}$/i.test(settings[k]||'')?settings[k]:k==='color'?'#222222':'#ffffff';input.disabled=picker.disabled=disabled;document.querySelector('[data-clear-colour="'+k+'"]').disabled=disabled}document.querySelector('#design-transparent').disabled=!selected}
function setColour(key,value){if(!data||!designSelected)return;data.design||={};data.design[designFile]||={};const settings=data.design[designFile][designSelected]||={};if(value==='')delete settings[key];else settings[key]=value;changed();designSend()}
for(const key of ['color','background']){const input=document.querySelector('#design-'+key),picker=document.querySelector('#design-'+key+'-picker');picker.addEventListener('input',()=>{input.value=picker.value;input.setCustomValidity('');setColour(key,picker.value)});input.addEventListener('input',()=>{const v=input.value.trim();const valid=v===''||/^#[0-9a-f]{6}$/i.test(v)||(key==='background'&&v==='transparent');input.setCustomValidity(valid?'':'Use a six-digit colour such as #283a2c.');if(!valid)return;if(v.startsWith('#'))picker.value=v;setColour(key,v)});document.querySelector('[data-clear-colour="'+key+'"]').onclick=()=>{setColour(key,'');designShow()}}
document.querySelector('#design-transparent').onclick=()=>{setColour('background','transparent');designShow()};

document.querySelector('#design-reset').onclick=()=>{if(data.design?.[designFile])delete data.design[designFile][designSelected];changed();designShow();designSend()};

document.querySelector('#add-project').onclick=()=>{const slug='project-'+Date.now();data.projects.push({slug,title:'New project',category:'Game Design',year:String(new Date().getFullYear()),role:'',tools:'',source:'',summary:'',intro:'',cover:'project-placeholder.svg',theme:'',overviewHeading:'About the Game',contributionsHeading:'My Contributions',layout:{sourcePage:'',ids:{},overviewMedia:[],rows:[]},sections:[],gallery:[]});current=slug;options();page.value=slug;render();frame.src='about:blank';changed();message('New project added. Edit its details, then save.');};
function options(){const value=current;page.replaceChildren();for(const [v,label] of [['home','Homepage'],...data.projects.map(p=>[p.slug,p.title])]){const o=el('option',label);o.value=v;page.append(o)}page.value=value||'home'}function refresh(){const view=document.querySelector('#view').value;frame.src='/__editor/preview/'+view+'/'+(current==='home'?'index.html':'projects/'+current+'.html')+'?preview='+Date.now();document.querySelector('#open-preview').href=frame.src}document.querySelector('#view').onchange=refresh;async function save(){message('Saving…');try{const r=await fetch('/__editor/save',{method:'POST',headers:{'Content-Type':'application/json','X-Editor-Token':token},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error);data.revision=j.revision;dirty=false;message('Draft saved');options();refresh();return true}catch(e){message(e.message,true)}}page.onchange=()=>{current=page.value;render();refresh()};document.querySelector('#publish').onclick=async()=>{const b=document.querySelector('#publish');b.disabled=true;try{if(!await save())return;message('Publishing…');const r=await fetch('/__editor/publish',{method:'POST',headers:{'Content-Type':'application/json','X-Editor-Token':token},body:JSON.stringify({revision:data.revision})});const j=await r.json();if(!r.ok)throw Error(j.error);message(j.message||'Published — Portfolio, Games and UI are up to date.');}catch(e){message(e.message,true)}finally{b.disabled=false}};document.querySelector('#save').onclick=save;document.querySelector('#preview-save').onclick=save;document.querySelector('#mobile').onclick=()=>{frame.style.width='390px';frame.style.maxWidth='100%'};document.querySelector('#desktop').onclick=()=>frame.style.width='100%';window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});fetch('/__editor/data').then(r=>r.json()).then(j=>{if(!j.data||!j.token)throw Error('Editor unavailable');token=j.token;data=j.data;options();render();refresh();message('Ready to edit')}).catch(e=>{message('Editor unavailable. Reopen Open Editor.cmd and refresh this page.',true);document.querySelectorAll('header button').forEach(b=>b.disabled=true)});
})();
</script></body></html>
