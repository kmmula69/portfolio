name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build all views
        run: node build-pages.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Check links and categories
        run: node check-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for uploaded build to be available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          (async () => {
            const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts`;
            for (let attempt = 0; attempt < 12; attempt++) {
              const response = await fetch(url, {headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json'
              }});
              if (!response.ok) throw new Error(`Build lookup failed: ${response.status}`);
              const data = await response.json();
              if (data.artifacts?.some(a => a.name === 'github-pages' && !a.expired)) {
                console.log('Uploaded build is ready.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            throw new Error('Uploaded build did not become available.');
          })().catch(error => { console.error(error.message); process.exit(1); });
          NODE
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
